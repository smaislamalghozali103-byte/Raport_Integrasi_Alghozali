name: Python syntax check
on:
  push:
    branches: ["python-streamlit"]
  pull_request:
    branches: ["main"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile app.py database.py excel_utils.py pdf_report.py importer.py services/google_sheets.py
